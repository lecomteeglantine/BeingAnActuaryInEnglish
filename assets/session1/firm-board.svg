<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Actuarial firm design board</title><desc id="d">A strategy board with cards for services, clients, team roles, values and a final pitch.</desc><rect width="900" height="560" rx="32" fill="#102a43"/><rect x="70" y="60" width="760" height="440" rx="28" fill="#f9fbfd"/><text x="105" y="115" fill="#102a43" font-family="Arial" font-size="26" font-weight="700">YOUR IDEAL ACTUARIAL FIRM</text><g font-family="Arial"><rect x="105" y="155" width="205" height="125" rx="18" fill="#e8f6f7"/><text x="130" y="195" fill="#0b7285" font-size="18" font-weight="700">1 · SERVICES</text><path d="M130 225h145M130 250h105" stroke="#0b7285" stroke-width="9" stroke-linecap="round" opacity=".6"/><rect x="345" y="155" width="205" height="125" rx="18" fill="#edf2fa"/><text x="370" y="195" fill="#1f4e79" font-size="18" font-weight="700">2 · CLIENTS</text><path d="M370 225h145M370 250h110" stroke="#1f4e79" stroke-width="9" stroke-linecap="round" opacity=".6"/><rect x="585" y="155" width="205" height="125" rx="18" fill="#fff3d1"/><text x="610" y="195" fill="#8a6318" font-size="18" font-weight="700">3 · TEAM</text><path d="M610 225h145M610 250h95" stroke="#d49b24" stroke-width="9" stroke-linecap="round" opacity=".65"/><rect x="105" y="315" width="325" height="125" rx="18" fill="#f5eff8"/><text x="130" y="355" fill="#6b3f75" font-size="18" font-weight="700">4 · VALUES &amp; DIFFERENCE</text><path d="M130 385h250M130 410h180" stroke="#8a5a96" stroke-width="9" stroke-linecap="round" opacity=".55"/><rect x="465" y="315" width="325" height="125" rx="18" fill="#edf7ef"/><text x="490" y="355" fill="#216e39" font-size="18" font-weight="700">5 · FINAL PITCH</text><path d="M490 385h250M490 410h205" stroke="#4f9562" stroke-width="9" stroke-linecap="round" opacity=".55"/></g></svg>
